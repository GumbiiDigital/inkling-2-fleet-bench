<text x="24" y="257" font-size="13" fill="#f0efec" font-weight="600">30-minute serial soak (450 W vs 600 W)</text>
<text x="24" y="281.5" font-size="12" fill="#c3c2b7">450 W · soak decode</text>
<path d="M192.56,270 H549.61 Q553.61,270 553.61,274 V280 Q553.61,284 549.61,284 H192.56 Z" fill="#199e70"><title>30-minute serial soak (450 W vs 600 W) · 450 W · soak decode: 65.7 tok/s 221 W mean, 67 °C</title></path>
<text x="561.61" y="281.5" font-size="12" fill="#f0efec" font-weight="600">65.7 tok/s</text>
<text x="644.01" y="281.5" font-size="11" fill="#898781">221 W mean, 67 °C</text>
<text x="24" y="307.5" font-size="12" fill="#c3c2b7">600 W · soak decode</text>
<path d="M192.56,296 H551.92 Q555.92,296 555.92,300 V306 Q555.92,310 551.92,310 H192.56 Z" fill="#3987e5"><title>30-minute serial soak (450 W vs 600 W) · 600 W · soak decode: 66.1 tok/s 222 W mean, 66 °C</title></path>
