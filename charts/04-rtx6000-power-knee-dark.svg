<text x="646.32" y="129.5" font-size="11" fill="#898781">matches 600 W</text>
<text x="24" y="155.5" font-size="12" fill="#c3c2b7">600 W · decode @512</text>
<path d="M192.56,144 H549.84 Q553.84,144 553.84,148 V154 Q553.84,158 549.84,158 H192.56 Z" fill="#3987e5"><title>Decode @512 and @128K (450 W vs 600 W) · 600 W · decode @512: 86.8 tok/s card max</title></path>
<text x="561.84" y="155.5" font-size="12" fill="#f0efec" font-weight="600">86.8 tok/s</text>
<text x="644.24" y="155.5" font-size="11" fill="#898781">card max</text>
<text x="24" y="181.5" font-size="12" fill="#c3c2b7">450 W · decode @128K</text>
<path d="M192.56,170 H454.73 Q458.73,170 458.73,174 V180 Q458.73,184 454.73,184 H192.56 Z" fill="#199e70"><title>Decode @512 and @128K (450 W vs 600 W) · 450 W · decode @128K: 63.9 tok/s matches 600 W</title></path>
<text x="466.73" y="181.5" font-size="12" fill="#f0efec" font-weight="600">63.9 tok/s</text>
<text x="549.13" y="181.5" font-size="11" fill="#898781">matches 600 W</text>
<text x="24" y="207.5" font-size="12" fill="#c3c2b7">600 W · decode @128K</text>
<path d="M192.56,196 H454.6 Q458.6,196 458.6,200 V206 Q458.6,210 454.6,210 H192.56 Z" fill="#3987e5"><title>Decode @512 and @128K (450 W vs 600 W) · 600 W · decode @128K: 63.9 tok/s card max</title></path>
<text x="466.6" y="207.5" font-size="12" fill="#f0efec" font-weight="600">63.9 tok/s</text>
<text x="549" y="207.5" font-size="11" fill="#898781">card max</text>
