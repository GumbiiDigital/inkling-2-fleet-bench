<text x="614.2" y="281.5" font-size="11" fill="#898781">221 W mean, 67 °C</text>
<text x="24" y="307.5" font-size="12" fill="#c3c2b7">600 W · soak decode</text>
<path d="M192.56,296 H521.92 Q525.92,296 525.92,300 V306 Q525.92,310 521.92,310 H192.56 Z" fill="#3987e5"><title>30-minute serial soak (450 W vs 600 W) · 600 W · soak decode: 66.1 tok/s 222 W mean, 66 °C</title></path>
