<text x="24" y="40" font-size="16" fill="#f0efec" font-weight="600">RTX PRO 6000 Blackwell power envelope: 450 W matches 600 W</text>
<text x="24" y="57" font-size="12" fill="#c3c2b7">Single-stream llama.cpp Q4_K_XL naturally draws ~221 W mean / ~230 W peak during serial soak, so 450 W and</text>
<text x="24" y="74" font-size="12" fill="#c3c2b7">600 W are identical.</text>
<text x="24" y="105" font-size="13" fill="#f0efec" font-weight="600">Decode @512 and @128K (450 W vs 600 W)</text>
<text x="24" y="129.5" font-size="12" fill="#c3c2b7">450 W · decode @512</text>
