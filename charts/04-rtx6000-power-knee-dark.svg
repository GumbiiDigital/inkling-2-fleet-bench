<text x="646.32" y="307.5" font-size="11" fill="#898781">222 W mean, 66 °C</text>
<text x="24" y="333.5" font-size="12" fill="#c3c2b7">350 W* · day-1 baseline</text>
<path d="M192.56,322 H405.78 Q409.78,322 409.78,326 V332 Q409.78,336 405.78,336 H192.56 Z" fill="#e66767"><title>30-minute serial soak (450 W vs 600 W) · 350 W* · day-1 baseline: 39.5 tok/s 327 W / 84 °C (suspect)</title></path>
<text x="417.78" y="333.5" font-size="12" fill="#f0efec" font-weight="600">39.5 tok/s</text>
<text x="500.18" y="333.5" font-size="11" fill="#898781">327 W / 84 °C (suspect)</text>
<line x1="192.56" y1="266" x2="192.56" y2="340" stroke="#383835" stroke-width="1"/>
<text x="24" y="396" font-size="11" fill="#898781">*Audit note: the day-1 350 W run drew 327 W mean / 84 °C while running slower (physically inconsistent with a pure</text>
<text x="24" y="412" font-size="11" fill="#898781">power cap; likely co-resident load).</text>
<text x="24" y="428" font-size="11" fill="#898781">Track H runs serial 64-token requests with inter-request nvidia-smi polling (not a saturated TDP stress test);</text>
<text x="24" y="444" font-size="11" fill="#898781">per-point SM clocks were not logged.</text>
</svg>
