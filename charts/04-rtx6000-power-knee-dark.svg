<text x="444.75" y="181.5" font-size="12" fill="#f0efec" font-weight="600">63.9 tok/s</text>
<text x="527.15" y="181.5" font-size="11" fill="#898781">matches 600 W</text>
<text x="24" y="207.5" font-size="12" fill="#c3c2b7">600 W · decode @128K</text>
<path d="M192.56,196 H432.64 Q436.64,196 436.64,200 V206 Q436.64,210 432.64,210 H192.56 Z" fill="#3987e5"><title>Decode @512 and @128K (450 W vs 600 W) · 600 W · decode @128K: 63.9 tok/s card max</title></path>
<text x="444.64" y="207.5" font-size="12" fill="#f0efec" font-weight="600">63.9 tok/s</text>
<text x="527.04" y="207.5" font-size="11" fill="#898781">card max</text>
