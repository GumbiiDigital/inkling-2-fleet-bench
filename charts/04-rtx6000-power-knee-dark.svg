<text x="532.01" y="155.5" font-size="12" fill="#f0efec" font-weight="600">86.8 tok/s</text>
<text x="614.41" y="155.5" font-size="11" fill="#898781">card max</text>
<text x="24" y="181.5" font-size="12" fill="#c3c2b7">450 W · decode @128K</text>
