<text x="24" y="281.5" font-size="12" fill="#c3c2b7">450 W · soak decode</text>
<path d="M192.56,270 H519.8 Q523.8,270 523.8,274 V280 Q523.8,284 519.8,284 H192.56 Z" fill="#199e70"><title>30-minute serial soak (450 W vs 600 W) · 450 W · soak decode: 65.7 tok/s 221 W mean, 67 °C</title></path>
