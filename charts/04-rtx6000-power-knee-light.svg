<text x="24" y="596" font-size="11" fill="#898781">At 350 W, SW Power Cap throttles clocks (~1800 MHz), raising duty cycle to 327 W mean / 84 °C.</text>
<text x="24" y="612" font-size="11" fill="#898781">At 450 W and 600 W, the workload peaks at ~230 W (not cap-bound) and finishes faster. 450 W buys 100% of 600 W</text>
<text x="24" y="628" font-size="11" fill="#898781">performance.</text>
