<text x="24" y="604" font-size="11" fill="#898781">On Metal, IQ4_NL (mainline 418fe97) is the fastest quant on both Macs; BF16 beats both NVIDIA Sparks (+24% to +39%).</text>
<text x="24" y="620" font-size="11" fill="#898781">30-min soak stayed flat with pmset nominal thermals on both Macs (M4 Max 27.3 tok/s, M3 Ultra 24.4 tok/s; no sudo for</text>
<text x="24" y="636" font-size="11" fill="#898781">wattage).</text>
